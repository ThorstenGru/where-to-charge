<!doctype html>
<meta charset="utf-8">
<title>calc tests</title>
<body style="font-family:monospace">
<!-- Open over http (local server or the Pages URL): the iframe must be same-origin. -->
<pre id="o">running ...</pre>
<iframe src="../index.html" style="display:none"></iframe>
<script>
document.querySelector("iframe").onload = function () {
  var calc = this.contentWindow.__calc, adv = this.contentWindow.__advice, out = [], fail = 0;
  function eq(name, got, want, tol) {
    var ok = Math.abs(got - want) <= (tol || 0.01);
    if (!ok) fail++;
    out.push((ok ? "PASS " : "FAIL ") + name + ": got " + got + ", want " + want);
  }
  function yes(name, cond) { eq(name, cond ? 1 : 0, 1); }

  // --- calculation: winter, battery 20 %, hold 15 %, petrol 15.74, home 5.00, 3 h, car 3.6 kW, charger 22 kW ---
  var st = {season: "winter", soc: 20, hold: 15, petrol: 15.74, home: 5, hours: 3, kw: 3.6};
  var c = calc(st, {id: "x", name: "X", op: "Mer", kw: 22});
  eq("free kWh (10.4 * 80/85)", c.free, 9.788);
  eq("home kWh = free kWh", c.home.kwh, 9.788);
  eq("home total SEK", c.home.total, 2.21);
  eq("home petrol break-even", c.home.be, 15.06);
  eq("electricity break-even (value per kWh)", c.value, 5.2257);
  eq("worth-the-effort limit", c.limit, 5.2257 - 0.3);
  eq("road kWh (battery room is the limit)", c.road.kwh, 9.788);
  eq("road petrol value SEK", c.road.saved, 51.15);
  eq("no charger: no road option", calc(st, null).road === null ? 1 : 0, 1);

  var base = {season: "winter", soc: 20, hold: 15, petrol: 15, hours: 1, kw: 3.6};
  eq("soc below hold counts as hold level", calc(Object.assign({}, base, {soc: 5, home: 5}), null).free, 10.4);
  eq("full battery has nothing to charge", calc(Object.assign({}, base, {soc: 100, home: 5}), null).free, 0);
  eq("0.5 h at 3.6 kW is limited by time", calc({season: "summer", soc: 20, hold: 15, petrol: 15, home: 5, hours: 0.5, kw: 3.6}, {id: "y", name: "Y", op: "", kw: 22}).road.kwh, 1.8);
  eq("charger slower than the car sets the power", calc({season: "summer", soc: 20, hold: 15, petrol: 15, home: 5, hours: 12, kw: 3.6}, {id: "z", name: "Z", op: "", kw: 2.3}).road.pw, 2.3);
  eq("unknown charger power: the car's limit", calc(base, {id: "u", name: "U", op: "", kw: 0}).road.pw, 3.6);

  // --- recommendation (petrol 15 -> value 4.98 SEK/kWh, limit 4.68) ---
  var ch = {id: "x", name: "X", op: "Mer", kw: 22};
  var good = adv(calc(Object.assign({}, base, {home: 4.0}), ch), 1);
  yes("good home price: charge at home", good.big === "Charge at home");
  yes("with a charger: top up only below the home price", /less than 4\.00 SEK\/kWh/.test(good.act));
  yes("with a charger: the rest at home", /rest at home/.test(good.act));
  var cheapHome = adv(calc(Object.assign({}, base, {home: 4.9}), ch), 1);
  yes("weak home gain (0.08): HEV mode", cheapHome.big === "Drive in HEV mode");
  yes("HEV: road limit is named", /below 4\.68 SEK\/kWh/.test(cheapHome.l2));
  yes("no charger: points to the map", /Find my location/.test(adv(calc(Object.assign({}, base, {home: 4.0}), null), 1).l2));
  yes("full battery: do not charge", adv(calc(Object.assign({}, base, {soc: 100, home: 4}), null), 1).big === "Do not charge");
  yes("home dearer than petrol: HEV mode", adv(calc(Object.assign({}, base, {home: 6}), null), 1).big === "Drive in HEV mode");

  document.title = fail ? "FAIL" : "PASS";
  document.getElementById("o").textContent = (fail ? fail + " FAILED\n" : "ALL PASSED\n") + out.join("\n");
};
</script>
