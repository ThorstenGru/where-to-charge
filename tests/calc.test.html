    yes("invalid language falls back", ["en", "de", "sv"].indexOf(S.lang) >= 0);
    yes("non-numeric price falls back to the default", S.petrol === 15.8 || S.petrol > 12);
    eq("out-of-range car value is clamped", S.cv.usable, 200);
    return fresh("{broken json").then(function (g) {
      yes("damaged JSON is kept as a backup", localStorage.getItem(KEYS + "-bad") === "{broken json");
      yes("page still works with damaged JSON", g.contentWindow.__state().car === "phev");
      g.remove();
      return fresh('{"lang":"sv","cv":{"elS":30}}', "?lang=de");
    });
  }).then(function (h) {
    var W2 = h.contentWindow, S2 = W2.__state();
    eq("?lang=de shows German", S2.lang === "de" ? 1 : 0, 1);
    W2.document.getElementById("hours").value = "2"; W2.document.getElementById("hours").dispatchEvent(new W2.Event("input"));
    var st = JSON.parse(localStorage.getItem(KEYS));
    yes("?lang= does not replace the stored language", st.lang === "sv");
    yes("cv stored per value (only the changed one)", st.cv && Object.keys(st.cv).join() === "elS");
    if (saved === null) { localStorage.removeItem(KEYS); } else { localStorage.setItem(KEYS, saved); }
    localStorage.removeItem(KEYS + "-bad");
    h.remove();
    return fetch("../cars.json").then(function (r) { return r.json(); }).then(function (j) {
      var LIMS = {usable: [1, 200], kw: [1, 50], hold: [0, 60], elS: [5, 80], elW: [5, 80], lS: [1, 30], lW: [1, 30]};
      yes("cars.json: version 1 with models", j.v === 1 && j.cars.length >= 5);
      yes("cars.json: unique ids", new Set(j.cars.map(function (c) { return c.id; })).size === j.cars.length);
      yes("cars.json: every value inside the app's limits", j.cars.every(function (c) { return Object.keys(LIMS).every(function (k) { return c.v[k] >= LIMS[k][0] && c.v[k] <= LIMS[k][1]; }); }));
      yes("cars.json: source and confidence on every model", j.cars.every(function (c) { return c.src && /^[AB]$/.test(c.conf) && (c.type === "bev" || c.type === "phev"); }));
      yes("cars.json: winter consumption above summer, a BEV gets a DC peak", j.cars.every(function (c) { return c.v.elW > c.v.elS && (c.type !== "bev" || c.dc >= 50); }));
      finish();
    });
  });
};
