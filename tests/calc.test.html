<!doctype html>
<meta charset="utf-8">
<title>calc tests</title>
<body style="font-family:monospace">
<!-- Open over http (local server or the Pages URL): the iframe must be same-origin. -->
<pre id="o">running ...</pre>
<iframe src="../index.html" style="display:none"></iframe>
<script>
setTimeout(function () {   // if the page never loads, say so instead of staying at "running ..."
  if (document.title !== "PASS" && document.title !== "FAIL") { document.title = "FAIL"; document.getElementById("o").textContent = "FAILED: the page did not load or the tests did not finish"; }
}, 8000);
document.querySelector("iframe").onload = function () {
  var calc = this.contentWindow.__calc, adv = this.contentWindow.__advice, out = [], fail = 0;
  function eq(name, got, want, tol) {
    var ok = Math.abs(got - want) <= (tol || 0.01);
    if (!ok) fail++;
    out.push((ok ? "PASS " : "FAIL ") + name + ": got " + got + ", want " + want);
  }
  function yes(name, cond) { eq(name, cond ? 1 : 0, 1); }

  // --- calculation: winter, battery 20 %, hold 15 %, petrol 15.74, home 5.00, 3 h, car 3.6 kW, charger 22 kW ---
  var st = {season: "winter", soc: 20, hold: 15, petrol: 15.74, home: 5, hours: 3, kw: 3.6};
  var c = calc(st, {id: "x", name: "X", op: "Mer", kw: 22});
  eq("free kWh (10.4 * 80/85)", c.free, 9.788);
  eq("home kWh = free kWh", c.home.kwh, 9.788);
  eq("home total SEK", c.home.total, 2.21);
  eq("home petrol break-even", c.home.be, 15.06);
  eq("electricity break-even (value per kWh)", c.value, 5.2257);
  eq("worth-the-effort limit", c.limit, 5.2257 - 0.3);
  eq("road kWh (battery room is the limit)", c.road.kwh, 9.788);
  eq("road petrol value SEK", c.road.saved, 51.15);
  eq("no charger: no road option", calc(st, null).road === null ? 1 : 0, 1);

  var base = {season: "winter", soc: 20, hold: 15, petrol: 15, hours: 1, kw: 3.6};
  eq("soc below hold counts as hold level", calc(Object.assign({}, base, {soc: 5, home: 5}), null).free, 10.4);
  eq("full battery has nothing to charge", calc(Object.assign({}, base, {soc: 100, home: 5}), null).free, 0);
  eq("0.5 h at 3.6 kW is limited by time", calc({season: "summer", soc: 20, hold: 15, petrol: 15, home: 5, hours: 0.5, kw: 3.6}, {id: "y", name: "Y", op: "", kw: 22}).road.kwh, 1.8);
  eq("charger slower than the car sets the power", calc({season: "summer", soc: 20, hold: 15, petrol: 15, home: 5, hours: 12, kw: 3.6}, {id: "z", name: "Z", op: "", kw: 2.3}).road.pw, 2.3);
  eq("unknown charger power: the car's limit", calc(base, {id: "u", name: "U", op: "", kw: 0}).road.pw, 3.6);

  // --- recommendation (petrol 15 -> value 4.98 SEK/kWh, limit 4.68) ---
  var ch = {id: "x", name: "X", op: "Mer", kw: 22};
  var good = adv(calc(Object.assign({}, base, {home: 4.0}), ch), 1);
  yes("good home price: charge at home", good.big === "Charge at home");
  yes("with a charger: top up only below the home price", /less than 4\.00 SEK\/kWh/.test(good.act));
  yes("with a charger: the rest at home", /rest at home/.test(good.act));
  var cheapHome = adv(calc(Object.assign({}, base, {home: 4.9}), ch), 1);
  yes("weak home gain (0.08): HEV mode", cheapHome.big === "Drive in HEV mode");
  yes("HEV: road limit is named", /below 4\.68 SEK\/kWh/.test(cheapHome.l2));
  yes("no charger: points to the map", /Use my location/.test(adv(calc(Object.assign({}, base, {home: 4.0}), null), 1).l2));
  yes("full battery: do not charge", adv(calc(Object.assign({}, base, {soc: 100, home: 4}), null), 1).big === "Do not charge");
  yes("home dearer than petrol: HEV mode", adv(calc(Object.assign({}, base, {home: 6}), null), 1).big === "Drive in HEV mode");

  // --- charger facts from the data flags ---
  var facts = this.contentWindow.__facts;
  function has(name, list, part) { yes(name, list.join("|").indexOf(part) >= 0); }
  var all = facts(4, 64 | 2 | 4 | 8 | 128 | 1, 24, 2026);
  has("points", all, "4 points"); has("fixed cable", all, "fixed cable"); has("card", all, "card or membership");
  has("notice", all, "notice required"); has("pay", all, "pay at the location"); has("free", all, "free according");
  has("parking fee", all, "parking fee"); has("verified", all, "last verified 2024");
  yes("last year verification is not marked old", facts(4, 0, 25, 2026).join("|").indexOf("(old)") < 0);
  has("two years old is marked old", all, "last verified 2024 (old)");
  has("old verification is marked", facts(1, 0, 19, 2026), "last verified 2019 (old)");
  has("one point", facts(1, 0, 25, 2026), "1 point");
  yes("no flags, no year: nothing claimed", facts(0, 0, 0, 2026).length === 0);
  yes("no fixed-cable claim without the flag", facts(2, 2, 25, 2026).join("|").indexOf("cable") < 0);
  yes("parking hint only as unverified", facts(2, 16, 25, 2026).join("|").indexOf("(unverified)") > 0);

  // --- time at the charger ---
  var tb = calc(Object.assign({}, base, {home: 4}), null);   // winter: 4 km per kWh, free 9.788 kWh
  eq("no homeHours given: no time limit at home", tb.home.kwh, 9.788);
  var hm = function(amp, hrs) { return calc(Object.assign({}, base, {home: 4, homeHours: hrs, homeAmp: amp}), null).home.kwh; };
  eq("home 10 A socket, 1 h: 2.3 kWh", hm(10, 1), 2.3);
  eq("home 6 A socket, 1 h: 1.38 kWh", hm(6, 1), 1.38);
  eq("home 8 A socket, 1 h: 1.84 kWh", hm(8, 1), 1.84);
  eq("home 12 A socket, 1 h: 2.76 kWh", hm(12, 1), 2.76);
  eq("home 16 A socket (3.68 kW): the car limit 3.6 kW decides", hm(16, 1), 3.6);
  eq("home wallbox (0 A = car limit): 3.6 kWh in 1 h", hm(0, 1), 3.6);
  eq("home 10 A socket, 10 h: limited by the battery", hm(10, 10), 9.788);
  eq("1 h at 3.6 kW gives 14.4 km", tb.at(1, 3.6).km, 14.4);
  eq("1 h at 2.3 kW gives 9.2 km", tb.at(1, 2.3).km, 9.2);
  eq("22 kW charger is limited to the car's 3.6 kW", tb.at(1, 22).kwh, 3.6);
  yes("12 h is full", tb.at(12, 3.6).full === true);
  yes("0.5 h is not full", tb.at(0.5, 3.6).full === false);
  eq("full charge takes 9.788 / 3.6 h", tb.fillH(3.6), 9.788 / 3.6);

  // --- chargers around a position ---
  var bc = this.contentWindow.__chargers;
  var ev = {v: 1, ops: ["(Unknown Operator)", "Mer", "Circle K"], s: [
    [55.700, 13.2, 2, 22, 2, 0, 0, "Site A"], [55.700, 13.2, 3, 22, 2, 0, 0, "Site A other operator"],
    [55.700, 13.2, 2, 22, 2, 0, 0, "Site A duplicate"], [55.800, 13.2, 0, 50, 4, 0, 0, "DC charger"],
    [55.710, 13.2, 1, 0, 1, 0, 0, "Unnamed"], [55.900, 13.2, 2, 11, 1, 0, 0, "Far"]]};
  var ch = bc(ev, 55.7, 13.2);
  eq("two operators at one site stay, duplicate and DC are dropped", ch.length, 4);
  yes("nearest first", ch[0].dist <= ch[1].dist && ch[1].dist <= ch[2].dist && ch[2].dist <= ch[3].dist);
  yes("ids differ per operator", ch[0].id !== ch[1].id);
  yes("unnamed operator shown as unknown", ch.filter(function (c) { return c.name === "Unnamed"; })[0].op === "operator unknown");
  yes("wrong file version throws", (function () { try { bc({v: 2, ops: [], s: []}, 55, 13); } catch (e) { return true; } return false; })());
  var many = {v: 1, ops: [], s: []};
  for (var q = 0; q < 200; q++) { many.s.push([55 + q / 1000, 13, 0, 22, 1, 0, 0, "n" + q]); }
  eq("at most 150 chargers", bc(many, 55, 13).length, 150);

  // --- home price months ---
  var fcast = this.contentWindow.__forecast, BILL = this.contentWindow.__bill;
  var typical = {"2023": [1.04, 1.03, .92, .74, .74, 1.03, .42, .5, .51, .36, .85, .8], "2024": [.84, .55, .63, .62, .51, .63, .43, .46, .31, .3, .85, .69], "2025": [.76, 1.04, .61, .58, .6, .41, .46, .73, .71, .71, .81, .65]};
  var A = Object.assign({}, typical, {"2026": [1.13, 1.13, .85, .67, .95, 1.04, .86, .8, 1.2, 1.57, 3.27, null]});
  var fc = fcast({monthly: A, partial: {month: "2026-11", days: 10}}, 2026, BILL);
  yes("months: bill month, this month, 3 estimates", fc.months.map(function (m) { return m.label; }).join() === "Oct,Nov,Dec,Jan,Feb");
  eq("bill month price from the October bill", fc.months[0].price, 2.875, 0.005);
  eq("factor from the last 3 months", fc.f, 3.23, 0.05);
  eq("December estimate", fc.months[2].price, 3.2, 0.05);
  yes("estimate lies inside its range", fc.months[2].lo < fc.months[2].price && fc.months[2].price < fc.months[2].hi);
  yes("current month is marked as an estimate", /^estimated/.test(fc.months[1].kind));
  var Jan = Object.assign({}, typical, {"2026": [1.13, 1.13, .85, .67, .95, 1.04, .86, .8, 1.2, 1.57, 3.27, 3.0], "2027": [0.4]});
  var fj = fcast({monthly: Jan, partial: {month: "2027-01", days: 2}}, 2027, BILL);
  yes("early January: the last 3 months include last year", fj.f > 1.5);
  yes("early January starts with January", fj.months[0].label === "Jan");
  yes("no data: null", fcast({monthly: {"2026": []}}, 2026, BILL) === null);

  document.title = fail ? "FAIL" : "PASS";
  document.getElementById("o").textContent = (fail ? fail + " FAILED\n" : "ALL PASSED\n") + out.join("\n");
};
</script>
