<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where to charge today?</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17803d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Where to charge">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src https://eurofuelprices.com https://api.open-meteo.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#eef1ec; --surface:#ffffff; --ink:#15201b; --muted:#5d6b64; --line:#d5dcd5;
  --home:#1f5fa8; --home-bg:#dce9f7;
  --remote:#17803d; --remote-bg:#d9f0e0;
  --hev:#a86400; --hev-bg:#fbe9c8;
  --neg:#b3261e; --focus:#1f5fa8;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --surface:#18211c; --ink:#e8efe9; --muted:#97a69d; --line:#2b3831;
    --home:#7db4f0; --home-bg:#16293e;
    --remote:#5fd18a; --remote-bg:#12301d;
    --hev:#f0b44f; --hev-bg:#3a2a0c;
    --neg:#ff8a80; --focus:#7db4f0;
    color-scheme: dark;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:15px;font-weight:700;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.verdict{border-radius:16px;padding:18px 16px;margin-bottom:12px;border:4px solid currentColor}
.verdict .lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}
.verdict .act{font-size:19px;font-weight:700;color:var(--ink);margin:0 0 8px}
.verdict.remote{background:var(--remote-bg);color:var(--remote)}
.verdict.home{background:var(--home-bg);color:var(--home)}
.verdict.hev{background:var(--hev-bg);color:var(--hev)}
.verdict .big{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 6px}
.verdict .sub{color:var(--ink);font-size:15px;margin:0}
.verdict .sub + .sub{margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1 1 120px;min-width:0}
.gap{height:14px}
label.l{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type="text"]{width:100%;font:inherit;font-size:17px;padding:10px 10px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type="range"]{width:100%;accent-color:var(--remote)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;padding:10px;background:var(--bg);color:var(--ink);border:0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.langs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.langs button{font:inherit;font-size:13px;padding:6px 10px;background:var(--surface);color:var(--ink);border:0;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.primary{font-size:17px;padding:12px 22px;font-weight:700;background:var(--remote);color:var(--surface);border-color:var(--remote)}
.chip[aria-pressed="true"]{border-color:var(--remote);box-shadow:0 0 0 2px var(--remote) inset}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;
  padding:10px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt input[type="radio"]{width:22px;height:22px;accent-color:var(--remote)}
.opt .name{font-weight:600}
.opt .meta{grid-column:2 / 4;font-size:13px;color:var(--muted)}
.net{font-weight:700;white-space:nowrap}
.pos{color:var(--remote)} .neg{color:var(--neg)}
.small{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.hint:empty{display:none}
.tiles{display:flex;gap:8px;margin:6px 0 12px}
.tile{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.tile .cap{font-size:12px;color:var(--muted)}
.tile .big{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.tile .unit{font-size:13px;color:var(--muted)}
.tile .st{font-size:13px;font-weight:700;margin-top:4px}
.cmp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cmp h3{font-size:15px;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.cmp p{margin:3px 0;font-size:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
th,td{text-align:right;padding:4px 6px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);border-top:0}
#map{height:300px;border-radius:12px;border:1px solid var(--line);margin-top:8px}
#map:empty{display:none}
#chinfo{margin-top:8px;font-size:14px}
a{color:var(--home)}
select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:10px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--remote)}
details summary{cursor:pointer;font-weight:700;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-i18n="title">Where to charge today?</h1>
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button data-l="en" aria-pressed="true">EN</button>
      <button data-l="de" aria-pressed="false">DE</button>
      <button data-l="sv" aria-pressed="false">SV</button>
    </div>
  </div>

  <!-- 0. Location first: it sets the petrol price and the chargers, which the recommendation depends on -->
  <section class="card">
    <h2 data-i18n="locTitle">Where are you?</h2>
    <button id="loc" class="chip primary" data-i18n="locBtn">Use my location</button>
    <p id="locmsg" class="small" style="margin:8px 0 0"></p>
  </section>

  <!-- 1. Answer -->
  <section id="verdict" class="verdict home" aria-live="polite"></section>
  <p id="pricewarn" class="hint" style="color:var(--neg);font-weight:700;margin:0 0 12px"></p>

  <section class="card">
    <h2 data-i18n="beTitle">Break-even</h2>
    <div id="be"></div>
    <p class="hint" data-i18n="beHint"></p>
  </section>

  <!-- 2. What you can adjust -->
  <section class="card">
    <h2 data-i18n="carTitle">Your car</h2>
    <label class="l" for="car" data-i18n="carLabel">Car type</label>
    <select id="car"></select>
    <div class="gap"></div>
    <label class="l" for="soc"><span data-i18n="socLabel">Battery level</span>: <b id="socv"></b></label>
    <input id="soc" type="range" min="0" max="100" step="5">
    <p class="hint" id="sochint"></p>
    <div class="gap"></div>
    <label class="l" data-i18n="season">Season</label>
    <div class="seg" role="group" aria-label="Season">
      <button id="sWinter" aria-pressed="true" data-i18n="winter">Winter</button>
      <button id="sSummer" aria-pressed="false" data-i18n="summer">Summer</button>
    </div>
    <label class="check"><input type="checkbox" id="usetemp"><span data-i18n="useTemp"></span></label>
    <p id="seasonnote" class="hint"></p>
  </section>

  <section class="card">
    <h2 data-i18n="timeTitle">Time at the charger</h2>
    <p class="hint" style="margin-top:0" data-i18n="timeHint"></p>
    <div class="tablewrap"><table id="timetab"></table></div>
    <p id="fillnote" class="hint"></p>
  </section>

  <section class="card">
    <h2 data-i18n="chTitle">Chargers near you (Type 2, AC)</h2>
    <p id="mapmsg" class="small" style="margin:0"></p>
    <div id="map"></div>
    <div id="chselwrap" hidden>
      <label class="l" for="chsel" style="margin-top:8px" data-i18n="chSelLabel"></label>
      <select id="chsel"></select>
    </div>
    <div id="chinfo"></div>
    <div class="gap"></div>
    <label class="l" for="hours"><span data-i18n="hoursLabel">Time parked at the charger</span>: <b id="hoursv"></b></label>
    <input id="hours" type="range" min="0.5" max="12" step="0.5">
    <p id="pwnote" class="hint"></p>
  </section>

  <section class="card">
    <h2 id="petTitle" data-i18n="petTitle">Petrol (daily price)</h2>
    <label class="l" for="petrol" data-i18n="petLabel"></label>
    <input id="petrol" type="text" inputmode="decimal" autocomplete="off">
    <p id="petrolsrc" class="hint"></p>
    <div id="petrols" class="small" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <h2 data-i18n="homeTitle">Electricity at home</h2>
    <label class="l" data-i18n="areaLabel">Electricity price area</label>
    <div id="areas" class="chips" style="margin-top:0"></div>
    <p class="hint" data-i18n="areaHint"></p>
    <div class="gap"></div>
    <label class="l" data-i18n="contractLabel">Your electricity contract</label>
    <div id="contracts" class="chips" style="margin-top:0"></div>
    <p id="contracthint" class="hint"></p>
    <div class="gap"></div>
    <label class="l" for="home" data-i18n="priceLabel"></label>
    <input id="home" type="text" inputmode="decimal" autocomplete="off">
    <div id="months" class="chips"></div>
    <p id="monthnote" class="hint"></p>
    <div class="gap"></div>
    <label class="l" for="fees" data-i18n="feesLabel"></label>
    <input id="fees" type="text" inputmode="decimal" autocomplete="off">
    <p class="hint" data-i18n="feesHint"></p>
    <div class="gap"></div>
    <label class="l" for="homehours"><span data-i18n="homeHoursLabel"></span>: <b id="homehoursv"></b></label>
    <input id="homehours" type="range" min="1" max="24" step="1">
    <label class="l" style="margin-top:10px" data-i18n="ampLabel"></label>
    <div id="homeamps" class="chips" style="margin-top:0"></div>
    <p id="homepw" class="hint"></p>
  </section>

  <section class="card">
    <h2 data-i18n="distTitle">Distance (optional)</h2>
    <label class="l" for="tomorrow" data-i18n="tomLabel"></label>
    <input id="tomorrow" type="text" inputmode="decimal" autocomplete="off">
    <p id="tomout" class="small" style="margin:8px 0 14px;color:var(--ink)"></p>
    <label class="l" for="trip" data-i18n="tripLabel"></label>
    <input id="trip" type="text" inputmode="decimal" autocomplete="off">
    <p id="tripout" class="small" style="margin:8px 0 0;color:var(--ink)"></p>
  </section>

  <section class="card">
    <h2 data-i18n="yearTitle">Per year (estimate)</h2>
    <label class="l" for="perweek"><span data-i18n="perWeekLabel"></span>: <b id="perweekv"></b></label>
    <input id="perweek" type="range" min="1" max="14" step="1">
    <p id="yearout" class="small" style="margin:8px 0 0;color:var(--ink)"></p>
  </section>

  <!-- 3. Details and settings last -->
  <section class="card">
    <h2 data-i18n="cmpTitle">Comparison in detail</h2>
    <div id="cmp"></div>
    <details>
      <summary data-i18n="rateSummary"></summary>
      <p id="rate" class="small"></p>
    </details>
  </section>

  <section class="card">
    <h2 data-i18n="logTitle">Measure your real consumption</h2>
    <p class="hint" style="margin-top:0" data-i18n="logHint"></p>
    <div class="row" style="margin-top:8px">
      <div class="field"><label class="l" for="logkwh" data-i18n="logKwh"></label><input id="logkwh" type="text" inputmode="decimal" autocomplete="off"></div>
      <div class="field"><label class="l" for="logkm" data-i18n="logKm"></label><input id="logkm" type="text" inputmode="decimal" autocomplete="off"></div>
    </div>
    <button id="logadd" class="chip primary" style="margin-top:10px;font-size:15px;padding:8px 18px" data-i18n="logAdd">Add</button>
    <div id="loglist" class="small" style="margin-top:10px"></div>
    <div id="logsum" style="margin-top:8px;font-size:14px"></div>
  </section>

  <section class="card">
    <details>
      <summary data-i18n="setTitle">Car settings and assumptions</summary>
      <div class="gap"></div>
      <label class="l" for="cvusable" data-i18n="setUsable"></label>
      <input id="cvusable" type="text" inputmode="decimal" autocomplete="off">
      <div class="gap"></div>
      <label class="l" for="cvkw" data-i18n="setKw"></label>
      <input id="cvkw" type="text" inputmode="decimal" autocomplete="off">
      <p class="hint" data-i18n="setKwHint"></p>
      <div class="gap"></div>
      <label class="l" for="cvhold" id="lblhold"></label>
      <input id="cvhold" type="text" inputmode="decimal" autocomplete="off">
      <p class="hint" data-i18n="setHoldHint"></p>
      <div class="gap"></div>
      <div class="row">
        <div class="field"><label class="l" for="cvelS" data-i18n="setElS"></label><input id="cvelS" type="text" inputmode="decimal" autocomplete="off"></div>
        <div class="field"><label class="l" for="cvelW" data-i18n="setElW"></label><input id="cvelW" type="text" inputmode="decimal" autocomplete="off"></div>
      </div>
      <div class="gap"></div>
      <div class="row">
        <div class="field"><label class="l" for="cvlS" id="lbllS"></label><input id="cvlS" type="text" inputmode="decimal" autocomplete="off"></div>
        <div class="field"><label class="l" for="cvlW" id="lbllW"></label><input id="cvlW" type="text" inputmode="decimal" autocomplete="off"></div>
      </div>
      <button id="cvreset" class="chip" style="margin-top:10px" data-i18n="reset"></button>
      <p class="small" id="carnote" style="margin:12px 0 0"></p>
      <p class="small" style="margin:8px 0 0" data-i18n="setCommon"></p>
    </details>
  </section>
  <p class="hint" data-i18n="foot"></p>
</main>

<script>

  var KEY = "wo-laden-heute-v1";
  var LANGS = ["en", "de", "sv"];
  var MAINS_V = 230;   // household socket: single phase

  var DECAY = 0.7, HIST = ["2023", "2024", "2025"];

    locBtn:["Use my location","Meinen Standort nutzen","Använd min plats"],
    locHint:["Your location sets the petrol price and shows the chargers around you. It stays on your phone; only the map tiles reveal the area to OpenStreetMap. The page covers Sweden for now (petrol, electricity price areas SE1–SE4, chargers).","Dein Standort bestimmt den Benzinpreis und zeigt die Ladepunkte in deiner Nähe. Er bleibt auf deinem Handy; nur die Kartenkacheln verraten das Gebiet an OpenStreetMap. Die Seite deckt vorerst Schweden ab (Benzin, Strompreisgebiete SE1–SE4, Ladepunkte).","Din plats avgör bensinpriset och visar laddare nära dig. Den stannar på din telefon; bara kartrutorna avslöjar området för OpenStreetMap. Sidan täcker tills vidare Sverige (bensin, elprisområden SE1–SE4, laddare)."],

    doNot:["Do not charge","Nicht laden","Ladda inte"],
    doNotAct:["Do not plug in. Drive in hybrid mode.","Nicht anstecken. Im Hybridmodus fahren.","Sätt inte i sladden. Kör i hybridläge."],

  function detectLang(){ var q = Q || (navigator.language || "en").slice(0, 2); return LANGS.indexOf(q) >= 0 ? q : "en"; }
  var m0 = new Date().getMonth();

  function isNum(x){ return typeof x === "number" && isFinite(x); }
  if(LANGS.indexOf(S.lang) < 0){ S.lang = DEFAULT.lang; }
  if(Q && LANGS.indexOf(Q) >= 0){ S.lang = Q; }   // ?lang=de for links and tests, never stored

  // One odd stored value must never break the page: anything that is not a finite number falls back to the default.
  ["petrol", "home", "homeAdd", "soc", "hours", "homeHours", "homeAmp", "tomorrow", "trip"].forEach(function(k){ if(!isNum(S[k])){ S[k] = DEFAULT[k]; } });
  S.cv = Object.assign({}, PRESETS[S.car].v, (S.cv && typeof S.cv === "object") ? S.cv : {});
  CVKEYS.forEach(function(k){ if(!isNum(S.cv[k])){ S.cv[k] = PRESETS[S.car].v[k]; } });
  var LIM = {usable:[1, 200], kw:[1, 50], hold:[0, 60], elS:[5, 80], elW:[5, 80], lS:[1, 30], lW:[1, 30]};
  CVKEYS.forEach(function(k){ S.cv[k] = Math.min(LIM[k][1], Math.max(LIM[k][0], S.cv[k])); });

    }catch(e){}
  }
  function home(spot, add){ return (spot + add) * VAT; }
  function selCharger(){ return N.ch.filter(function(c){ return c.id === S.sel; })[0] || null; }

  // ---- pure logic (tested in tests/calc.test.html) ----
  // Consumption for the current conditions: between the summer and the winter value, by season or by outside temperature
  // (20 °C and warmer = summer value, 0 °C = winter value, colder keeps rising up to -10 °C).
  function consumption(st){
    var v = st.cv, w = st.temp != null ? Math.min(1.5, Math.max(0, (20 - st.temp) / 20)) : (st.season === "winter" ? 1 : 0);
    return {el:v.elS + (v.elW - v.elS) * w, l:v.lS + (v.lW - v.lS) * w};
  }
  // st = settings, ch = the chosen charger (or null). The road price is unknown by design: the road option only gets
  // what it can deliver (kWh, km, petrol saved) and the highest price worth paying.
  function calc(st, ch){
    var cv = st.cv, se = consumption(st), kw = cv.kw;
    var lPerKwh = se.l / se.el, per = 100 / se.el;
    var value = lPerKwh * st.petrol;   // what 1 kWh is worth in petrol (SEK)
    var free = cv.usable * (100 - Math.max(st.soc, cv.hold)) / (100 - cv.hold);   // chargeable kWh: the usable span between the hold level and 100 %
    // Home is limited like any charger: time parked x power. A household socket gives amps x 230 V; the car's limit still applies.
    // Without homeHours (old callers, tests) there is no time limit.
    var homePw = Math.min(kw, st.homeAmp > 0 ? st.homeAmp * MAINS_V / 1000 : kw), homeKwh = Math.min(free, (st.homeHours > 0 ? st.homeHours : 1e9) * homePw);
    var h = {price:st.home, kwh:homeKwh, pw:homePw, net:value - st.home, be:st.home / lPerKwh};
    h.cost = h.kwh * h.price; h.km = h.kwh * per; h.litres = h.kwh * lPerKwh; h.saved = h.kwh * value; h.total = h.net * h.kwh;
    var road = null;
    if(ch){
      var pw = Math.min(kw, ch.kw || kw), kwh = Math.min(free, st.hours * pw);
      road = {name:ch.name, op:ch.op, pw:pw, kwh:kwh, km:kwh * per, litres:kwh * lPerKwh, saved:kwh * value};
    }
    // km on electricity after `hours` at a charger of `power` kW (the car's own limit applies), and hours for a full charge
    var at = function(hours, power){ var k = Math.min(free, hours * Math.min(kw, power)); return {kwh:k, km:k * per, full:k >= free - 1e-9}; };
    var fillH = function(power){ return free / Math.min(kw, power); };
    return {home:h, road:road, value:value, limit:value - MIN_GAIN, lPerKwh:lPerKwh, per:per, free:free, cons:se, type:ptype(st), usable:cv.usable, hold:cv.hold, kw:kw, at:at, fillH:fillH};
  }
  window.__calc = calc; window.__consumption = consumption; window.__presets = PRESETS;

  // The recommendation as plain data. c = result of calc(), hours = parking time.
  function advice(c, hours){
    var h = c.home, r = c.road, bev = c.type === "bev", homeOk = h.net >= MIN_GAIN, a = {l2:""};
    var roadLine = r ? t("roadLine", {h:fmt(hours, 1), kw:fmt(r.pw, 1), kwh:fmt(r.kwh, 1), km:fmt(r.km, 0), name:r.name}) : "";
    if(c.free < 0.5){
      a.cls = "hev"; a.big = t(bev ? "doNotBev" : "doNot"); a.act = t(bev ? "fullBev" : "doNotAct"); a.l1 = t(bev ? "fullBev" : "full");
    } else if(!bev && !homeOk){
      a.cls = "hev"; a.big = t("hevBig"); a.act = t(h.net > 0 ? "hevAct1" : "hevAct2");
      a.l1 = h.net > 0 ? t("hevL1a", {x:fmt(h.net), min:fmt(MIN_GAIN)}) : t("hevL1b");
      if(r && c.limit > 0){ a.l2 = t("hevL2", {road:roadLine, x:fmt(c.limit)}); }
    } else {
      var x = bev ? h.price : Math.min(h.price, c.limit);   // cheaper than home (and, for a hybrid, still worth the effort against petrol)
      a.cls = "home"; a.big = t("homeBig");
      a.act = r ? t("homeActRoad", {name:r.name, x:fmt(x)}) : t("homeAct");
      a.l1 = t("homeL1", {kwh:fmt(h.kwh, 1), price:fmt(h.price), res:sek(h.total)});
      if(bev && h.net < 0){ a.l2 = t("bevNeg", {x:fmt(-h.net)}); }
      else { a.l2 = r ? t("homeL2road", {road:roadLine, price:fmt(h.price)}) : t("homeL2none"); }
    }
    return a;
  }
  window.__advice = advice;

  // Facts about a charger from the data file (ev_se.json flags). f = flag bits, yy = last verification year (2 digits), now = current year.
  // Price-like entries (cost notes) are not used. Bit 64 means "only fixed-cable Type 2 here"; its absence says nothing, so nothing is claimed then.
  function facts(pts, f, yy, now){
    var a = [];
    if(pts > 0){ a.push(pts === 1 ? t("fPts1") : t("fPtsN", {n:pts})); }
    if(f & 64){ a.push(t("fCable")); }
    if(f & 1){ a.push(t("fFree")); }
    if(f & 2){ a.push(t("fCard")); }
    if(f & 4){ a.push(t("fNotice")); }
    if(f & 8){ a.push(t("fPay")); }
    if(f & 128){ a.push(t("fFee")); } else if(f & 16){ a.push(t("fFeeHint")); }
    if(yy > 0){ a.push(t("fVer", {y:"20" + (yy < 10 ? "0" : "") + yy}) + (now - (2000 + yy) >= 2 ? t("fOld") : "")); }
    return a;
  }
  window.__facts = facts;
  function chLabel(c){ return c.name + " · " + (c.op === "operator unknown" ? t("opUnknown") : c.op) + " · " + (c.kw ? c.kw + " kW" : t("chPower")) + " · Type 2 AC" + (c.pts ? " · " + (c.pts === 1 ? t("fPts1") : t("fPtsN", {n:c.pts})) : ""); }

  // Chargers around a position, nearest first: one entry per site and operator, Type 2 AC up to 22 kW, the 150 nearest.
  function buildChargers(ev, la, lo){
    if(ev.v !== 1){ throw 0; }   // column layout is only known for version 1
    var seen = {};
    return ev.s.map(function(x){
      var op = x[2] > 0 ? ev.ops[x[2]-1] : "", key = nrm(op);
      // id = position + operator, stable when the file is rebuilt; two operators at one site stay separate
      return {id:"s" + Math.round(x[0] * 1e4) + "_" + Math.round(x[1] * 1e4) + (key ? "_" + key.replace(/[^a-z0-9]/g, "") : ""), name:x[7] || "Charger", op:key ? op : "operator unknown", kw:+x[3] || 0, pts:+x[4] || 0, f:x[5] | 0, yy:+x[6] || 0, lat:x[0], lon:x[1], dist:hav(la, lo, x[0], x[1])};
    }).filter(function(c){ if(c.kw > 22 || seen[c.id]){ return false; } seen[c.id] = 1; return true; })
      .sort(function(a, b){ return a.dist - b.dist; }).slice(0, 150);
  }
  window.__chargers = buildChargers;

  // Month list for the home price chips. a = spot data of one price area (elpris.json), y = this year, add = fees on top of the spot price.
  // Early in the year the "last 3 months" come from the year before (else 1 or 2 days would decide everything).
  function forecast(a, y, add){
    var m = a.monthly[String(y)] || [], prev = a.monthly[String(y - 1)] || [], i = m.length - 1;
    while(i >= 0 && m[i] == null){ i--; }
    if(i < 0){ return null; }
    var typ = function(k){
      var v = HIST.map(function(h){ return a.monthly[h] && a.monthly[h][k]; }).filter(function(x){ return x != null; });
      return v.length ? v.reduce(function(s, x){ return s + x; }, 0) / v.length : null;
    };
    var part = a.partial && a.partial.month === y + "-" + (i < 9 ? "0" : "") + (i + 1);
    var rat = [], k;
    for(k = i - 2; k <= i; k++){ var v = k >= 0 ? m[k] : prev[k + 12], tk = typ((k + 12) % 12); if(v != null && tk > 0){ rat.push(v / tk); } }
    if(!rat.length){ return null; }
    var f = Math.min(5, rat.reduce(function(s, x){ return s + x; }, 0) / rat.length);   // capped so one odd month cannot blow up the estimate
    var list = [], lastV = i >= 1 ? m[i - 1] : prev[11];
    if(lastV != null){ list.push({idx:(i + 11) % 12, spot:lastV, kk:"kindLast", kp:{}}); }
    var tc = typ(i);
    if(part && tc > 0){
      // The bill uses the whole-month average: known days + estimate for the rest of the month.
      var dim = new Date(y, i + 1, 0).getDate(), w = a.partial.days / dim, rest = tc * (1 + (f - 1) * DECAY);
      list.push({idx:i, spot:w * m[i] + (1 - w) * rest, lo:home(w * m[i] + (1 - w) * tc, add), hi:home(m[i], add), kk:"kindEst", kp:{d:a.partial.days, n:dim, a:m[i]}});
    } else {
      list.push({idx:i, spot:m[i], kk:"kindMonth", kp:{}});
    }
    for(k = 1; k <= 3; k++){
      var mi = (i + k) % 12, tt = typ(mi);
      if(tt > 0){ list.push({idx:mi, spot:tt * (1 + (f - 1) * Math.pow(DECAY, k)), lo:home(tt, add), hi:home(tt * f, add), kk:"kindFc", kp:{}}); }
    }
    return {months:list.map(function(x){ x.price = home(x.spot, add); return x; }), f:f, i:i};
  }
  window.__forecast = forecast;

  // Hourly contract: the n cheapest hours of the next 24 h (today from now on, tomorrow up to the same hour, as far as published).
  // Returns the average spot price and the hours, or null without usable data for today.
  function cheapestHours(a, now, n){
    if(!a || !a.today || !a.today.sek){ return null; }
    var pad = function(x){ return (x < 10 ? "0" : "") + x; };
    if(a.today.date !== now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate())){ return null; }   // stale data
    var h0 = now.getHours(), list = [];
    a.today.sek.forEach(function(p, h){ if(p != null && h >= h0){ list.push({p:p, o:h}); } });
    if(a.tomorrow && a.tomorrow.sek){ a.tomorrow.sek.forEach(function(p, h){ if(p != null && h < h0){ list.push({p:p, o:24 + h}); } }); }
    if(!list.length){ return null; }
    var pick = list.slice().sort(function(x, y){ return x.p - y.p; }).slice(0, Math.min(n, list.length)).sort(function(x, y){ return x.o - y.o; });
    return {avg:pick.reduce(function(s, x){ return s + x.p; }, 0) / pick.length, hours:pick.map(function(x){ return pad(x.o % 24) + ":00"; })};

  // Real consumption per season from the log: kWh at the socket / electric km. Needs at least 20 km per season.
  function logStats(log){

      var e = log.filter(function(x){ return x.s === s; }), kwh = 0, km = 0;
      e.forEach(function(x){ kwh += x.kwh; km += x.km; });

  // Per year, charging at home perWeek times from empty to full, half a year with summer and half with winter values.

  function tile(cap, big, unit, st, ok){ return '<div class="tile"><div class="cap">' + cap + '</div><div class="big">' + big + '</div><div class="unit">' + unit + '</div><div class="st ' + (ok ? "pos" : "neg") + '">' + st + '</div></div>'; }

        : esc(t("logNeed", {s:t(s)}))) + '</p>';
    });
    $("logsum").innerHTML = out;
  }

  // Map of the chargers around you. Tap a marker to choose the charger.
  var MAP = {map:null, markers:{}, me:null};
  function styleMarkers(){
    Object.keys(MAP.markers).forEach(function(id){
      MAP.markers[id].setStyle(id === S.sel ? {radius:11, fillColor:"#17803d", color:"#fff", weight:3, fillOpacity:1} : {radius:7, fillColor:"#e08a00", color:"#fff", weight:2, fillOpacity:.95});
      if(id === S.sel){ MAP.markers[id].bringToFront(); }
    });
  }
  function drawMap(la, lo){
    if(!window.L){
      // Leaflet is loaded after the page (defer) and may arrive after the data: try again when everything has loaded.
      if(document.readyState !== "complete"){ window.addEventListener("load", function(){ drawMap(la, lo); }, {once:true}); return; }
      N.mapSt = "mapFail"; notes(); return;
    }
    N.mapSt = N.ch.length ? "mapReady" : "mapNone"; notes();
    if(!MAP.map){
      MAP.map = L.map("map", {zoomControl:true});
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap contributors"}).addTo(MAP.map);
    }
    Object.keys(MAP.markers).forEach(function(id){ MAP.markers[id].remove(); }); MAP.markers = {};
    if(MAP.me){ MAP.me.remove(); }
    MAP.me = L.circleMarker([la, lo], {radius:8, color:"#fff", weight:3, fillColor:"#1f5fa8", fillOpacity:1}).addTo(MAP.map);
    N.ch.forEach(function(c){
      var m = L.circleMarker([c.lat, c.lon], {radius:7}).addTo(MAP.map).bindTooltip(esc(chLabel(c)));
      m.on("click", function(){ S.sel = c.id; update(); });
      MAP.markers[c.id] = m;
    });
    var pts = [[la, lo]].concat(N.ch.slice(0, 30).map(function(c){ return [c.lat, c.lon]; }));
    MAP.map.invalidateSize();
    MAP.map.fitBounds(L.latLngBounds(pts), {padding:[24, 24], maxZoom:15});
    styleMarkers();
  }
  function renderChSelect(){
    var sel = $("chsel");
    $("chselwrap").hidden = !N.ch.length;
    sel.innerHTML = '<option value="">' + esc(t("chNone")) + '</option>' + N.ch.map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(fmt(c.dist, 1) + " km · " + chLabel(c)) + '</option>'; }).join("");
    sel.value = S.sel || "";
  }
  function renderChInfo(){
    var c = selCharger(), el = $("chinfo");
    if($("chsel").value !== (S.sel || "")){ $("chsel").value = S.sel || ""; }
    if(!N.ch.length){ el.innerHTML = ""; return; }
    var opn = c && (c.op === "operator unknown" ? t("opUnknown") : c.op);
    el.innerHTML = (c
      ? '<b>' + esc(c.name) + '</b><br>' + esc(t("chInfo", {op:opn, kw:c.kw ? c.kw + " kW" : t("chPower"), km:fmt(c.dist, 1)})) + ' <button class="chip" id="chclear" style="padding:2px 8px;font-size:12px">' + t("chClear") + '</button>' +
        '<br><span class="small">' + esc(facts(c.pts, c.f, c.yy, new Date().getFullYear()).join(" · ")) + '</span>' +
        '<br><a href="https://www.google.com/maps/dir/?api=1&destination=' + c.lat + ',' + c.lon + '" target="_blank" rel="noopener">' + t("navigate") + '</a> · <a href="https://duckduckgo.com/?q=' + encodeURIComponent((c.op === "operator unknown" ? c.name : c.op) + " laddning pris kWh") + '" target="_blank" rel="noopener">' + t("findPrice") + '</a>'
      : t("chNoSel")) +
      (N.evsrc ? '<p class="hint">' + esc(t("chData", {src:N.evsrc.by.join(", "), gen:(N.evsrc.gen ? t("chFile", {d:N.evsrc.gen}) : "") + (N.evsrc.old ? t("chOld") : "")})) + '</p>' : '');
  }

  function renderPetrols(){
    var w = $("petrols");
    if(!N.pe.length){ return; }
    w.className = ""; w.innerHTML = "";
    N.pe.forEach(function(p, i){
      var d = document.createElement("div"); d.className = "opt";
      d.innerHTML = '<input type="radio" name="pp" id="pp' + i + '" ' + (N.pick === i ? "checked" : "") + '>' +
        '<label class="name" for="pp' + i + '">' + esc(p.name) + '</label><b>' + fmt(p.price) + '</b>' +
        '<span class="meta">' + esc(t("petMeta", {km:fmt(p.dist, 1), when:p.date ? t("petAsOf", {d:p.date}) : t("petNoDate")})) + '</span>';
      w.appendChild(d);
      d.querySelector("input").addEventListener("change", function(){ N.pick = i; S.petrol = p.price; S.petrolEdited = false; save(); syncInputs(); update(); });
    });
  }

  function renderMonths(){
    var w = $("months"); w.innerHTML = "";
    if(S.contract !== "avg"){ return; }
    N.months.forEach(function(m){
      var b = document.createElement("button"); b.className = "chip";
      b.setAttribute("aria-pressed", Math.abs(S.home - m.price) < 0.005 ? "true" : "false");
      var kp = Object.assign({}, m.kp); if(kp.a != null){ kp.a = fmt(kp.a); }
      b.innerHTML = '<b>' + esc(monthName(m.idx)) + '</b>: ' + fmt(m.price) + '<br><span class="small">' + esc(t(m.kk, kp)) + t("monthSpot", {x:fmt(m.spot)}) + (m.lo ? '<br>' + t("monthRange", {a:fmt(m.lo), b:fmt(m.hi)}) : '') + '</span>';
      b.addEventListener("click", function(){ S.home = Math.round(m.price * 100) / 100; syncInputs(); update(); });   // a chip is a choice for this visit only
      w.appendChild(b);
    });
  }

  // ---- loading data ----
  function setLoc(k, p, far){ N.locSt = {k:k, p:p || {}, far:far}; notes(); }
  function locate(){
    setLoc("locFinding");
    if(!navigator.geolocation){ setLoc("locNoGeo"); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      var la = pos.coords.latitude, lo = pos.coords.longitude;
      N.loc = {la:la, lo:lo};
      setLoc("locLoading");
      Promise.all([getJ("ev_se.json"), getSE()]).then(function(r){
        var ev = r[0];
        N.evsrc = {old:Date.now() - Date.parse(ev.generated) > 21 * 864e5, gen:String(ev.generated || ""), by:(ev.sources || []).map(function(n){ return n === "NOBIL" ? "NOBIL by Enova (CC BY 4.0)" : n === "OCM" ? "Open Charge Map contributors (CC BY 4.0)" : String(n); })};
        N.ch = buildChargers(ev, la, lo);
        S.sel = N.ch.length ? N.ch[0].id : null;   // the nearest charger is preselected; tap another on the map or clear it
        var pe = [];
        r[1].stations.forEach(function(s){
          var l = (s.prices || []).filter(function(q){ return q.octane === 95 && q.price > 12 && q.price < 25; }), p = l.filter(isFresh)[0] || l[0];
          if(p){ pe.push({name:(s.brand || s.name || "Petrol station") + (s.city ? ", " + s.city : ""), price:p.price, date:p.updated_at ? p.updated_at.slice(0,10) : "", fresh:isFresh(p), dist:hav(la, lo, s.lat, s.lon)}); }
        });
        N.pe = pe.sort(function(a,b){ return a.dist - b.dist; }).filter(function(p){ return p.dist <= 50; }).slice(0, 5);   // a pump farther than 50 km is not "nearby"
        // Preselect the cheapest dated price; an undated price is chosen only if no dated one is nearby.
        N.pick = -1; N.pe.forEach(function(p, i){ var b = N.pe[N.pick]; if(N.pick < 0 || (p.fresh && !b.fresh) || (p.fresh === b.fresh && p.price < b.price)){ N.pick = i; } });
        if(N.pick >= 0){ S.petrol = N.pe[N.pick].price; S.petrolEdited = false; }
        save();
        N.locDone = true;
        N.locSt = {k:"locDone", p:{acc:Math.round(pos.coords.accuracy)}, far:(N.ch.length && N.ch[0].dist > 30) ? N.ch[0].dist : null};
        syncInputs(); update(); drawMap(la, lo);
        if(S.useTemp){ loadTemp(); }
      }).catch(function(){ setLoc("locErr"); });
    }, function(){ setLoc("locDenied"); }, {timeout:15000});
  }

  // Outside temperature at the rounded position (opt-in). Open-Meteo needs no key.
  function loadTemp(){
    if(!N.loc){ return; }
    fetch("https://api.open-meteo.com/v1/forecast?latitude=" + N.loc.la.toFixed(1) + "&longitude=" + N.loc.lo.toFixed(1) + "&current=temperature_2m")
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ var x = j.current && j.current.temperature_2m; if(isNum(x)){ S.temp = x; update(); } })
      .catch(function(){ S.temp = null; });
  }

  // Petrol is a daily price and loads automatically: national median of prices dated within the last 3 days
  // (all prices if fewer than 20 are dated). Cached for 6 hours so the 1.3 MB file is not fetched on every open.
  // "Use my location" replaces it with a nearby pump.
  var FRESH_MS = 3 * 864e5, PCACHE = "wo-laden-petrol-v1";
  function isFresh(q){ return !!q.updated_at && Date.now() - Date.parse(q.updated_at) < FRESH_MS; }
  function useMedian(m){ N.med = m; if(!S.petrolEdited && N.pick < 0){ S.petrol = m.price; } syncInputs(); update(); }
  function loadPetrol(){
    try{ var c = JSON.parse(localStorage.getItem(PCACHE)); if(c && c.m && Date.now() - c.at < 6 * 36e5){ useMedian(c.m); return; } }catch(e){}
    getSE().then(function(j){
      var all = [], fr = [];
      j.stations.forEach(function(s){ (s.prices || []).forEach(function(q){ if(q.octane === 95 && q.price > 12 && q.price < 25){ all.push(q.price); if(isFresh(q)){ fr.push(q.price); } } }); });
      var v = fr.length >= 20 ? fr : all;
      if(!v.length){ throw 0; }
      v.sort(function(a, b){ return a - b; });
      var m = {price:Math.round(v[v.length >> 1] * 100) / 100, n:v.length, fresh:v === fr, date:String(j.meta.newest_price_at || "").slice(0, 10)};
      try{ localStorage.setItem(PCACHE, JSON.stringify({at:Date.now(), m:m})); }catch(e){}
      useMedian(m);
    }).catch(function(){ N.petrolErr = true; update(); });
  }

  // Spot prices of the chosen price area: the month chips, and hourly prices for an hourly contract.
  function applySpot(){
    var a = N.el && N.el.areas && N.el.areas[S.area];
    var r = a && forecast(a, new Date().getFullYear(), S.homeAdd);
    N.months = r ? r.months : [];
    N.spotOk = !!r;
    if(r){
      var cur = N.months.filter(function(x){ return x.idx === r.i; })[0];
      if(!S.homeEdited && S.contract === "avg"){ S.home = Math.round(cur.price * 100) / 100; save(); }
      N.fc = r.f;
    }
    syncInputs(); update();
  }
  function loadSpot(){
    getJ("elpris.json").then(function(j){ N.el = j; applySpot(); }).catch(function(){ N.spotOk = false; N.spotErr = true; update(); });
  }

  // ---- state for the calculation, texts ----
  function calcState(){
    var st = Object.assign({}, S);
    N.hourly = null;
    if(S.contract === "hourly" && !S.homeEdited && N.el){
      var c0 = calc(S, null), n = Math.max(1, Math.ceil(c0.home.kwh / c0.home.pw));
      var hh = cheapestHours(N.el.areas && N.el.areas[S.area], new Date(), n);
      if(hh){ st.home = Math.round(home(hh.avg, S.homeAdd) * 100) / 100; N.hourly = {n:hh.hours.length, hours:hh.hours}; }
    }
    N.homeEff = st.home;
    return st;
  }

  function syncInputs(){
    var set = function(id, v){ var e = $(id); if(document.activeElement !== e){ e.value = v; } };   // never rewrite the field the user is typing in
    set("petrol", fmt(S.petrol));
    set("home", fmt(N.homeEff != null ? N.homeEff : S.home));
    set("fees", fmt(S.homeAdd));
    set("hours", S.hours);
    set("homehours", S.homeHours);
    set("tomorrow", fmt(S.tomorrow || 0, 0));
    set("trip", fmt(S.trip || 0, 0));
    set("perweek", S.perWeek != null ? S.perWeek : PRESETS[S.car].perWeek);
    CVKEYS.forEach(function(k){ set("cv" + k, fmt(S.cv[k], 1)); });
    set("car", S.car);
    $("soc").min = S.cv.hold; set("soc", Math.max(S.soc, S.cv.hold));
    $("usetemp").checked = S.useTemp;
    notes();
  }

  // Text that follows the state but never touches the input fields (so typing is not interrupted).
  function notes(){
    var c = selCharger(), ty = PRESETS[S.car].type, cons = consumption(S), usable = S.cv.usable;
    document.documentElement.lang = S.lang; document.title = t("title");
    [].forEach.call(document.querySelectorAll("[data-i18n]"), function(e){ e.textContent = t(e.getAttribute("data-i18n")); });
    [].forEach.call($("langs").children, function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-l") === S.lang); });
    var ls = N.locSt;
    $("locmsg").textContent = ls ? t(ls.k, ls.p) + (ls.far != null ? t("locFar", {km:fmt(ls.far, 0)}) : "") : t("locHint");
    $("mapmsg").textContent = t(N.mapSt || "mapIdle");
    if(!N.pe.length){ $("petrols").textContent = N.locDone ? t("petNone") : t("petList"); }
    $("petTitle").textContent = t(ty === "bev" ? "petTitleBev" : "petTitle");
    $("sochint").textContent = t(ty === "bev" ? "socHintBev" : "socHintPhev");
    $("lblhold").textContent = t(ty === "bev" ? "setHoldBev" : "setHoldPhev");
    $("lbllS").textContent = t("setLS", {what:t(ty === "bev" ? "petBev" : "petPhev")});
    $("lbllW").textContent = t("setLW", {what:t(ty === "bev" ? "petBev" : "petPhev")});
    $("carnote").textContent = t(S.car === "santafe" ? "noteSanta" : "noteGeneric");
    var sel = $("car"); if(sel.options.length !== 3 || sel.options[0].text !== t("car_phev")){ sel.innerHTML = Object.keys(PRESETS).map(function(k){ return '<option value="' + k + '">' + esc(t("car_" + k)) + '</option>'; }).join(""); sel.value = S.car; }
    [].forEach.call($("contracts").children, function(b){ b.textContent = t("c_" + b.getAttribute("data-c")); b.setAttribute("aria-pressed", b.getAttribute("data-c") === S.contract); });
    [].forEach.call($("areas").children, function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-a") === S.area); });
    [].forEach.call($("homeamps").children, function(b){ var a = +b.getAttribute("data-a"); b.textContent = a ? a + " A (" + fmt(a * MAINS_V / 1000, 2) + " kW)" : t("wallbox"); b.setAttribute("aria-pressed", a === S.homeAmp); });
    $("sWinter").setAttribute("aria-pressed", S.temp == null && S.season === "winter");
    $("sSummer").setAttribute("aria-pressed", S.temp == null && S.season === "summer");
    $("hoursv").textContent = fmt(S.hours, 1) + " h";
    $("homehoursv").textContent = fmt(S.homeHours, 0) + " h";
    $("socv").textContent = Math.max(S.soc, S.cv.hold) + " %";
    var sname = S.temp != null ? t("seasonTemp", {t:fmt(S.temp, 1)}) : t(S.season === "winter" ? "seasonWinter" : "seasonSummer");
    $("seasonnote").textContent = sname + " " + t("seasonVals", {el:fmt(cons.el, 1), km:fmt(usable * 100 / cons.el, 0), l:fmt(cons.l, 1), petrol:t(ty === "bev" ? "petBev" : "petPhev")});
    var ch = $("contracthint");
    if(S.contract === "avg"){ ch.textContent = t("cHintAvg"); }
    else if(S.contract === "fixed"){ ch.textContent = t("cHintFixed"); }
    else { ch.textContent = N.hourly ? t("cHintHourly", {n:N.hourly.n, hours:N.hourly.hours.join(", ")}) : t("cHintHourlyNo"); }
    $("monthnote").textContent = S.contract !== "avg" ? "" : (N.spotOk ? t("monthNote", {f:fmt(N.fc || 1, 1)}) : (N.spotErr ? t("spotNo", {x:fmt(DEFAULT.home)}) : ""));
    $("homepw").textContent = S.homeAmp > 0
      ? t("homePwAmp", {kw:fmt(Math.min(S.cv.kw, S.homeAmp * MAINS_V / 1000), 2), a:S.homeAmp, v:MAINS_V, raw:fmt(S.homeAmp * MAINS_V / 1000, 2), cap:S.homeAmp * MAINS_V / 1000 > S.cv.kw ? t("homePwCap", {kw:fmt(S.cv.kw, 1)}) : ""})
      : t("homePwWall", {kw:fmt(S.cv.kw, 1)});
    var p = N.pe[N.pick], tx;
    var newest = N.med && N.med.date ? t("newest", {d:N.med.date}) : "";
    if(p && Math.abs(p.price - S.petrol) < 0.005){ tx = t("petSrcPump", {name:p.name, km:fmt(p.dist, 1), when:p.date ? t("petAsOf", {d:p.date}) : t("petNoDate")}); }
    else if(!S.petrolEdited && N.med){ tx = t(N.med.fresh ? "petSrcFresh" : "petSrcOld", {n:N.med.n, newest:newest}); }
    else if(!S.petrolEdited && N.petrolErr){ tx = t("petSrcErr", {x:fmt(DEFAULT.petrol)}); }
    else { tx = t("petSrcHand"); }
    $("petrolsrc").textContent = tx;
    var w = [];
    if(S.petrol < 8 || S.petrol > 30){ w.push(t("warnPetrol", {x:fmt(S.petrol)})); }
    if(S.home > 15){ w.push(t("warnHome", {x:fmt(S.home)})); }
    if(!S.feesEdited && S.contract !== "fixed" && new Date() > new Date(FEES_VALID_TO + "T23:59:59")){ w.push(t("warnFees")); }
    $("pricewarn").textContent = w.join(" ");
    $("pwnote").textContent = c ? t("pwChosen", {kw:fmt(Math.min(S.cv.kw, c.kw || S.cv.kw), 1), name:c.name, ckw:c.kw ? ", " + c.kw + " kW" : ""}) : t("pwNone", {kw:fmt(S.cv.kw, 1)});
  }

  function update(){
    var st = calcState(), c = calc(st, selCharger());
    c.soc = S.soc;
    var hf = $("home"); if(document.activeElement !== hf){ hf.value = fmt(N.homeEff); }
    renderVerdict(c);
    renderBreak(c);
    renderCompare(c);
    renderTime(c);
    renderDistance(c);
    renderYear(st);
    renderLog();
    if(N.pe.length){ renderPetrols(); }
    if(N.ch.length){ renderChSelect(); }
    renderChInfo();
    renderMonths();
    styleMarkers();
    notes();
  }

  // ---- wiring ----
  function bindNum(id, fn){ $(id).addEventListener("input", function(e){ fn(num(e.target.value, null)); save(); update(); }); }
  bindNum("petrol", function(v){ if(v != null){ S.petrol = Math.max(0, v); S.petrolEdited = true; N.pick = -1; } });
  bindNum("home", function(v){ if(v != null){ S.home = Math.max(0, v); S.homeEdited = true; } });
  bindNum("fees", function(v){ if(v != null){ S.homeAdd = Math.max(0, v); S.feesEdited = true; if(N.el){ applySpot(); } } });
  $("hours").addEventListener("input", function(e){ S.hours = num(e.target.value, 1); save(); update(); });
  $("homehours").addEventListener("input", function(e){ S.homeHours = num(e.target.value, 10); save(); update(); });
  $("soc").addEventListener("input", function(e){ S.soc = parseInt(e.target.value, 10); save(); update(); });
  $("perweek").addEventListener("input", function(e){ S.perWeek = Math.round(num(e.target.value, 5)); save(); update(); });
  bindNum("tomorrow", function(v){ if(v != null){ S.tomorrow = Math.max(0, v); } });
  bindNum("trip", function(v){ if(v != null){ S.trip = Math.max(0, v); } });
  CVKEYS.forEach(function(k){
    $("cv" + k).addEventListener("input", function(e){ var v = num(e.target.value, null); if(v != null){ S.cv[k] = Math.min(LIM[k][1], Math.max(LIM[k][0], v)); save(); update(); } });
  });
  $("car").addEventListener("change", function(e){ S.car = e.target.value; S.cv = Object.assign({}, PRESETS[S.car].v); S.perWeek = null; save(); syncInputs(); update(); });
  $("cvreset").addEventListener("click", function(){ S.cv = Object.assign({}, PRESETS[S.car].v); save(); syncInputs(); update(); });
  $("sWinter").addEventListener("click", function(){ S.season = "winter"; S.useTemp = false; S.temp = null; save(); syncInputs(); update(); });
  $("sSummer").addEventListener("click", function(){ S.season = "summer"; S.useTemp = false; S.temp = null; save(); syncInputs(); update(); });
  $("usetemp").addEventListener("change", function(e){ S.useTemp = e.target.checked; S.temp = null; save(); if(S.useTemp){ loadTemp(); } update(); });
  [].forEach.call($("langs").children, function(b){ b.addEventListener("click", function(){ S.lang = b.getAttribute("data-l"); save(); syncInputs(); update(); }); });
  AREAS.forEach(function(a){ var b = document.createElement("button"); b.className = "chip"; b.setAttribute("data-a", a); b.textContent = a; b.addEventListener("click", function(){ S.area = a; save(); applySpot(); }); $("areas").appendChild(b); });
  CONTRACTS.forEach(function(c){ var b = document.createElement("button"); b.className = "chip"; b.setAttribute("data-c", c); b.addEventListener("click", function(){ S.contract = c; if(c === "avg"){ S.homeEdited = false; } save(); applySpot(); }); $("contracts").appendChild(b); });
  AMPS.concat([0]).forEach(function(a){
    var b = document.createElement("button"); b.className = "chip"; b.setAttribute("data-a", a);
    b.addEventListener("click", function(){ S.homeAmp = a; save(); update(); });
    $("homeamps").appendChild(b);
  });
  $("chsel").addEventListener("change", function(e){ S.sel = e.target.value || null; update(); });
  $("chinfo").addEventListener("click", function(e){ if(e.target.closest("#chclear")){ S.sel = null; update(); } });
  $("logadd").addEventListener("click", function(){
    var kwh = num($("logkwh").value, null), km = num($("logkm").value, null);
    if(!(kwh > 0 && km > 0)){ return; }
    var d = new Date(), pad = function(x){ return (x < 10 ? "0" : "") + x; };
    S.log.push({kwh:kwh, km:km, s:S.temp != null ? (S.temp < 10 ? "winter" : "summer") : S.season, d:d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())});
    S.log = S.log.slice(-50); $("logkwh").value = ""; $("logkm").value = ""; save(); update();
  });
  $("loglist").addEventListener("click", function(e){ var b = e.target.closest("[data-del]"); if(b){ S.log.splice(+b.getAttribute("data-del"), 1); save(); update(); } });
  $("logsum").addEventListener("click", function(e){
    var b = e.target.closest("[data-use]"); if(!b){ return; }
    var s = b.getAttribute("data-use"), x = logStats(S.log)[s];
    if(x && x.per100 != null){ S.cv[s === "winter" ? "elW" : "elS"] = Math.min(80, Math.max(5, Math.round(x.per100 * 10) / 10)); save(); syncInputs(); update(); }
  });
  $("loc").addEventListener("click", locate);

  syncInputs();   // fill the fields before any data arrives (also when a feed fails)
  update();
  loadPetrol();
  loadSpot();
  // If the permission is already granted, locate right away: no extra tap, no prompt.
  try{ navigator.permissions.query({name:"geolocation"}).then(function(p){ if(p.state === "granted"){ locate(); } }).catch(function(){}); }catch(e){}
})();
</script>
</body>
